<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bangalore House Price Predictor</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="container">
    <h1>🏠 Bangalore House Price Predictor</h1>

    <div class="form-group">
      <label for="uiSqft">Total Area (sqft):</label>
      <input type="number" id="uiSqft" placeholder="Enter total area in sqft" />
    </div>

    <div class="form-group">
      <label for="uiBHK">BHK:</label>
      <input type="number" id="uiBHK" placeholder="Enter number of bedrooms" />
    </div>

    <div class="form-group">
      <label for="uiBath">Bath:</label>
      <input type="number" id="uiBath" placeholder="Enter number of bathrooms" />
    </div>

    <div class="form-group">
      <label for="uiLocations">Location:</label>
      <select id="uiLocations">
        <option value="" disabled selected>Loading locations...</option>
      </select>
    </div>

    <button onclick="onClickedEstimatePrice()">Estimate Price</button>

    <!-- Result Section -->
    <div id="result-box">
      <h3>Predicted Price:</h3>
      <p id="uiEstimatedPrice">--</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
